# Meow2 CI — see docs/wiki/CI.md
#
# Safety rules for this file (the repo is public and one runner is the owner's PC):
#   - Windows jobs run on the self-hosted runner ONLY for code from this repository
#     (push to main, PRs from branches in this repo, manual runs). PRs from forks
#     never reach the self-hosted runner.
#   - Never use `pull_request_target`, never add secrets to self-hosted jobs, and
#     never paste untrusted `${{ github.event.* }}` text (titles, branch names)
#     into `run:` scripts.
#   - Third-party actions are pinned to a full commit SHA, not a movable tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The GITHUB_TOKEN can only read the repo — it can't push, comment or approve.
permissions:
  contents: read

# A new push to the same PR cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04            # GitHub-hosted: safe for any PR, including forks
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux checks portability (Clang: also the Android compiler; GCC: its own warnings and
        # stricter front end). Optimised builds are covered by the MSVC RelWithDebInfo/Release jobs.
        include:
          - name: Clang Debug
            preset: linux-clang-debug
            qt: true
          - name: GCC Debug
            preset: ""
            qt: true
          # Sanitizers (techstack.md §19): every test under ASan+UBSan and under TSan. Engine, Player and Renderer
          # only: the editor (and so Qt) is off in these presets, and memory tracking and profiling too.
          - name: Clang ASan+UBSan
            preset: linux-clang-asan
            qt: false
          - name: Clang TSan
            preset: linux-clang-tsan
            qt: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      # Hosted runners sometimes get a very slow Ubuntu mirror (minutes per run). The downloaded
      # .deb files are cached, so most runs only install them. Bump the "vN" to drop the cache.
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-ubuntu-24.04-v5-ninja-clang18-clangformat19-doxygen-spirvtools-sdl3-qt

      - name: Install tools
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -o Acquire::Retries=3
          # clang-format is pinned to major 19 (cmake/Meow2Format.cmake), the version VS 2022 ships.
          # doxygen: the Docs.PublicApi.IsDocumented test (cmake/Meow2Docs.cmake); configure fails in CI without it.
          # spirv-tools: spirv-val, for Shader.BindlessTest.SpirvPassesTheValidator.
          # lib*-dev: what SDL3 (external/SDL) needs to build its X11 and Wayland video drivers and udev/dbus support
          # (gamepads). The tests themselves use the offscreen driver, so no display server runs.
          # libgl-dev, libfontconfig1: Qt's Gui module needs OpenGL headers to configure and fontconfig to run (editor).
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$HOME/apt-cache" \
            ninja-build clang-18 clang-format-19 doxygen spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libudev-dev libdbus-1-dev \
            libgl-dev libfontconfig1
          # apt runs as root; give the files back to the runner user so the cache step can save them.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      # Qt for Meow2Editor (Ubuntu's own Qt is 6.4, older than the 6.8 the editor needs), the same version as on the
      # Windows runner. Plain steps instead of a Qt install action: the repository only allows GitHub's own actions
      # (docs/wiki/CI.md, Step 2), and a third-party one stops the whole workflow from starting. aqtinstall (pinned)
      # downloads Qt from Qt's servers; the install folder is cached, so most runs only restore it.
      - name: Cache Qt
        if: matrix.qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Qt
          key: qt-6.12.0-linux_gcc_64-aqt-3.3.0

      - name: Install Qt
        if: matrix.qt && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # A virtual environment: Ubuntu 24.04's system Python refuses `pip install` (PEP 668).
          python3 -m venv ~/aqt-venv
          ~/aqt-venv/bin/pip install --quiet aqtinstall==3.3.0
          ~/aqt-venv/bin/aqt install-qt linux desktop 6.12.0 linux_gcc_64 --outputdir ~/Qt

      - name: Point CMake at Qt
        if: matrix.qt
        run: echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.12.0/gcc_64" >> "$GITHUB_ENV"

      - name: Build and test (preset)
        if: matrix.preset != ''
        run: |
          set -o pipefail
          cmake --workflow --preset ${{ matrix.preset }} 2>&1 | tee ci.log

      - name: Build and test (GCC)
        if: matrix.preset == ''
        run: |
          set -o pipefail
          {
            cmake -S . -B build/gcc-debug -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug &&
            cmake --build build/gcc-debug &&
            ctest --test-dir build/gcc-debug --output-on-failure --no-tests=error
          } 2>&1 | tee ci.log

      # Show the end of the log as an annotation on the PR, so the failure is visible
      # in the PR's "Files changed"/"Checks" view without opening the raw log.
      - name: Report failure
        if: failure()
        run: |
          tail -n 60 ci.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}' > tail.txt
          echo "::error title=Build/test failed (last 60 lines)::$(cat tail.txt)"

  windows:
    name: Windows (MSVC ${{ matrix.config }})
    # Only code from this repository may run on the owner's PC.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, meow2]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [debug, relwithdebinfo, release]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false   # don't leave a token in .git/config on the PC
          clean: true

      - name: Build and test
        env:
          # Qt for Meow2Editor, installed on this PC with the Qt Maintenance Tool (MSVC 2022 64-bit kit).
          CMAKE_PREFIX_PATH: C:\Qt\6.12.0\msvc2022_64
          # Keeps DXC and the Agility SDK between jobs on this PC (cmake/Meow2Download.cmake), so a download hiccup on
          # GitHub's or NuGet's side doesn't fail a build. The runner's tool cache folder survives between jobs.
          MEOW2_DOWNLOAD_CACHE: ${{ runner.tool_cache }}\meow2-downloads
        # cmd, not PowerShell: PowerShell's execution policy (e.g. AllSigned) blocks the
        # unsigned temporary .ps1 that Actions generates for each step. Batch files are not
        # subject to that policy, so this works without weakening the PC's settings.
        shell: cmd
        run: |
          rem Find Visual Studio 2022 with the x64 C++ tools and load its developer environment
          rem (puts cl.exe, cmake and ninja on PATH), the same as a "Developer Command Prompt".
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo ::error::Visual Studio 2022 with the C++ x64 tools was not found on this runner. & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          where cl >nul 2>nul || (echo ::error::cl.exe not on PATH after vcvars64.bat & exit /b 1)

          rem Optional CPU pinning, set only by the runner's own .env file, never by the repo (docs/wiki/CI.md):
          rem MEOW2_CPU_AFFINITY=FFFF0000 keeps the build and the tests on those logical processors, at below-normal
          rem priority; child processes inherit both. Unset, the build runs as before.
          set "PIN="
          if defined MEOW2_CPU_AFFINITY set "PIN=start "" /b /wait /belownormal /affinity %MEOW2_CPU_AFFINITY%"
          if defined PIN echo Build pinned to CPU affinity mask %MEOW2_CPU_AFFINITY%
          rem "start" doesn't pass the exit code to || but does set ERRORLEVEL, so check it on its own line
          rem (a crash's exit code is negative, which "if errorlevel 1" would miss).
          %PIN% cmake --workflow --preset windows-msvc-${{ matrix.config }}
          if not "%ERRORLEVEL%"=="0" exit /b %ERRORLEVEL%
